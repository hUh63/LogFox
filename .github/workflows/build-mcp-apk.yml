name: Build APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name for the APK'
        required: false
        default: '1.1-logfox-mcp'
      version_code:
        description: 'Version code for the APK'
        required: false
        default: '101'
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - master

permissions:
  contents: write

env:
  VERSION_NAME: ${{ github.event.inputs.version_name || '1.1-logfox-mcp' }}
  VERSION_CODE: ${{ github.event.inputs.version_code || '101' }}

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.1.0" > /dev/null 2>&1 || true
          sdkmanager --list_installed | head -20 || true

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p apk-out
          find app/build/outputs/apk -name '*.apk' -exec cp -v {} apk-out/ \;
          ls -l apk-out

      - name: Verify APK
        run: |
          set -e
          APK=$(ls apk-out/*.apk | head -1)
          ls -l "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.1.0/aapt2"
          "$AAPT" dump badging "$APK" | head -5 || true
          "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" | grep -i "McpServerService" || true
          found=0
          for dex in $(unzip -Z1 "$APK" | grep -E '^classes[0-9]*\.dex$'); do
            if unzip -p "$APK" "$dex" | grep -qa "com/f0x1d/logfox/mcp/impl/McpServerService"; then
              echo "MCP server class found in $dex"
              found=1
            fi
          done
          test "$found" = "1"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: logfox-mcp-apk
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-out/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
