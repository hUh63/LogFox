name: Build APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name for the APK'
        required: false
        default: '2.1.10-hUh63-1.15'
      version_code:
        description: 'Version code for the APK'
        required: false
        default: '95'
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - master

permissions:
  contents: write

env:
  # On a tag push `github.event.inputs` is empty, so the tag name is used as the version
  # name (a `v` prefix is stripped in the Resolve version step). Without this every tag
  # release silently shipped the hard-coded default version and could not be installed
  # over the previous build.
  VERSION_NAME: ${{ inputs.version_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '2.1.10-hUh63-1.21' }}
  # Derived from the version name below when not passed explicitly (…-1.16 → 96). It used to
  # be a hard-coded literal, which was forgotten on every bump - the release then shipped with
  # the previous build's code and could not be installed over it
  VERSION_CODE: ${{ inputs.version_code || '' }}

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        run: |
          NAME="${VERSION_NAME#v}"
          CODE="${VERSION_CODE}"
          if [ -z "$CODE" ]; then
            MINOR="${NAME##*-}"
            CODE=$((80 + ${MINOR##*.}))
          fi
          echo "VERSION_NAME=${NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${CODE}" >> "$GITHUB_ENV"
          echo "Building ${NAME} (versionCode ${CODE})"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.1.0" > /dev/null 2>&1 || true
          sdkmanager --list_installed | head -20 || true

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p apk-out
          find app/build/outputs/apk/release -name '*.apk' -exec cp -v {} apk-out/ \;
          ls -l apk-out

      - name: Verify APK
        run: |
          set -e
          APK=$(ls apk-out/*.apk | head -1)
          ls -l "$APK"

          AAPT="$ANDROID_HOME/build-tools/36.1.0/aapt2"
          "$AAPT" dump badging "$APK" | head -5 || true
          "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" | grep -i "McpServerService" || true

          found=0
          for dex in $(unzip -Z1 "$APK" | grep -E '^classes[0-9]*\.dex$'); do
            if unzip -p "$APK" "$dex" | grep -qa "com/f0x1d/logfox/mcp/impl/McpServerService"; then
              echo "MCP server class found in $dex"
              found=1
            fi
          done
          test "$found" = "1"

          # .log files must be openable from other apps again (issue #235)
          MANIFEST_DUMP=$("$AAPT" dump xmltree --file AndroidManifest.xml "$APK")
          echo "$MANIFEST_DUMP" | grep -q "LogFileViewerActivity"
          echo "$MANIFEST_DUMP" | grep -q "android.intent.action.VIEW"
          echo "LogFileViewerActivity + VIEW intent filter found"

          viewer_found=0
          for dex in $(unzip -Z1 "$APK" | grep -E '^classes[0-9]*\.dex$'); do
            if unzip -p "$APK" "$dex" | grep -qa "com/f0x1d/logfox/presentation/ui/activity/LogFileViewerActivity"; then
              echo "Log file viewer class found in $dex"
              viewer_found=1
            fi
          done
          test "$viewer_found" = "1"

          APKSIGNER="$ANDROID_HOME/build-tools/36.1.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Dump Room schemas
        if: always()
        run: |
          echo "=== room schemas ==="
          find . -path '*/schemas/*' -name '*.json' | sort | tail -10 || true
          for f in $(find . -path '*/schemas/*' -name '19.json'); do
            echo "----- BEGIN $f -----"
            cat "$f"
            echo "----- END $f -----"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: logfox-release-apk
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-out/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
